name: F-Nodes

on:
  workflow_dispatch:
#  schedule:
#    - cron: '0 18,0,6,12 * * *'

concurrency:
  group: mc-startup
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 强制 5 分钟超时，防止挂死浪费额度
    permissions:
      contents: write
      actions: write
    concurrency:
      group: falix-renew
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: 5分钟间隔检查
        id: time_check
        run: |
          TIME_FILE="time.txt"
          NOW=$(date +%s)
          
          if [ -f "$TIME_FILE" ]; then
            LAST_TIME_STR=$(cat "$TIME_FILE" | xargs)
            if [ -n "$LAST_TIME_STR" ]; then
              LAST_TIME=$(date -d "$LAST_TIME_STR" +%s 2>/dev/null || echo 0)
              DIFF=$((NOW - LAST_TIME))
              
              echo "上次运行时间: $LAST_TIME_STR"
              echo "距离上次运行过去了: ${DIFF} 秒"
              
              if [ $DIFF -lt 300 ]; then
                echo "⏰ 距离上次运行不足 5 分钟（需等待 $((300 - DIFF)) 秒），直接终止后续运行！"
                # 设置标志量为 true 供后续步骤判断 skip
                echo "skip=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
          fi
          echo "符合运行条件，继续执行..."
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 设置 Python
        if: steps.time_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装基础依赖
        if: steps.time_check.outputs.skip != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb unzip jq
          pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0
          sbase install chromedriver

      - name: 启用 WARP 网络
        if: steps.time_check.outputs.skip != 'true'
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 执行续期任务
        if: steps.time_check.outputs.skip != 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FALIX_SERVER_IP: ${{ secrets.FALIX_SERVER_IP }}
        run: |
          mkdir -p output/screenshots
          python main.py

      - name: 自动保存并推送 time.txt
        if: steps.time_check.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add time.txt
          git commit -m "update: run timestamp" || echo "No changes to commit"
          git push

    #  - name: 清理
    #    if: always()
    #    run: rm -rf output/screenshots/*.png
