name: F-Nodes

on:
  workflow_dispatch:
#  schedule:
#    - cron: '0 18,0,6,12 * * *'

concurrency:
  group: mc-startup
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 强制 5 分钟超时，防止挂死浪费额度
    permissions:
      contents: write
      actions: write
    concurrency:
      group: falix-renew
      cancel-in-progress: false

    steps:
      # 1. 强制拉取 main 分支的最新提交，防止远程调用拿到旧缓存
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # 2. 时间校验，不足 5 分钟直接 exit 1 报错打断
      - name: 5分钟间隔检查
        run: |
          TIME_FILE="time.txt"
          NOW=$(date +%s)
          
          if [ -f "$TIME_FILE" ]; then
            LAST_TIME_STR=$(cat "$TIME_FILE" | xargs)
            if [ -n "$LAST_TIME_STR" ]; then
              LAST_TIME=$(date -d "$LAST_TIME_STR" +%s 2>/dev/null || echo 0)
              DIFF=$((NOW - LAST_TIME))
              
              echo "上次运行时间: $LAST_TIME_STR"
              echo "距离上次运行过去了: ${DIFF} 秒"
              
              if [ $DIFF -lt 300 ]; then
                echo "❌ 距离上次运行不足 5 分钟（需等待 $((300 - DIFF)) 秒），强行终止任务！"
                exit 1  # 关键：直接强行终止，后续所有步骤都不再执行
              fi
            fi
          fi
          echo "符合运行条件，继续执行..."

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装基础依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb unzip jq
          pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0
          sbase install chromedriver

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 执行续期任务
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FALIX_SERVER_IP: ${{ secrets.FALIX_SERVER_IP }}
        run: |
          mkdir -p output/screenshots
          python main.py

      # 3. 运行成功后写入最新 ISO UTC 时间并提交
      - name: 记录并保存最新运行时间
        if: success()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > time.txt
          echo "最新运行时间已更新为: $(cat time.txt)"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add time.txt
          git commit -m "update: run timestamp [skip ci]" || echo "No changes to commit"
          git push
