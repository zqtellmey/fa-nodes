name: FalixNodes Auto Renew

on:
  workflow_dispatch: # 支持手动点击运行
 # schedule:
    # 按照香港时间(HKT)每6小时运行一次
    # 对应 HKT: 02:00, 08:00, 14:00, 20:00
 #   - cron: '0 18,0,6,12 * * *'

jobs:
  renew_job:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libosmesa6 libgl1-mesa-glx
          
      - name: 安装 Python 依赖
        run: |
          pip install seleniumbase requests pyvirtualdisplay
          # 确保安装内置浏览器驱动
          sbase install chromedriver

      - name: 执行续期并发送截图到TG
        env:
          # 必须在仓库 Settings -> Secrets -> Actions 中添加这两个变量
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 如果有代理需求，请添加下行
          # PROXY_SOCKS5: ${{ secrets.PROXY_SOCKS5 }}
        run: |
          python main.py

      - name: 清理临时文件
        if: always()
        run: |
          rm -rf output/screenshots/*.png
