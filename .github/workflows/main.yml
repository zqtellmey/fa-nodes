name: F-Nodes

on:
  workflow_dispatch:
#  schedule:
#    - cron: '0 18,0,6,12 * * *'

concurrency:
  group: mc-startup
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 强制 5 分钟超时，防止挂死浪费额度
    permissions:
      contents: write
      actions: write
    concurrency:
      group: falix-renew
      cancel-in-progress: false

    steps:
      # 1. 检出仓库
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # 拉取完整提交历史，防止脱节

      # 2. 【核心修复】强行拉取 GitHub 远端最新 Commit 上的 time.txt
      - name: 强制同步远端最新状态
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true

      # 3. 5分钟时间硬核校验
      - name: 5分钟间隔检查
        run: |
          TIME_FILE="time.txt"
          NOW=$(date +%s)
          
          if [ -f "$TIME_FILE" ]; then
            LAST_TIME_STR=$(cat "$TIME_FILE" | xargs)
            if [ -n "$LAST_TIME_STR" ]; then
              LAST_TIME=$(date -d "$LAST_TIME_STR" +%s 2>/dev/null || echo 0)
              DIFF=$((NOW - LAST_TIME))
              
              echo "[DEBUG] 读取到的 time.txt 内容: '$LAST_TIME_STR'"
              echo "[DEBUG] 当前系统时间戳: $NOW"
              echo "[DEBUG] 上次运行时间戳: $LAST_TIME"
              echo "[DEBUG] 距离上次运行过去了: ${DIFF} 秒"
              
              if [ $DIFF -lt 300 ]; then
                echo "❌【硬核拦截】距离上次运行仅过去 ${DIFF} 秒（不足 300 秒/5分钟），直接打断退出！"
                exit 1  # 强制终止整个 Action
              fi
            fi
          fi
          echo "✅ 符合 5 分钟运行条件，允许继续执行..."

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装基础依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb unzip jq
          pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0
          sbase install chromedriver

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 执行续期任务
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FALIX_SERVER_IP: ${{ secrets.FALIX_SERVER_IP }}
        run: |
          mkdir -p output/screenshots
          python main.py

      # 4. 运行成功后写入最新 ISO UTC 时间并强制推送到仓库
      - name: 记录并保存最新运行时间
        if: success()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > time.txt
          echo "最新运行时间已更新为: $(cat time.txt)"

          git add time.txt
          git commit -m "update: run timestamp [skip ci]" || echo "No changes to commit"
          git push origin main
