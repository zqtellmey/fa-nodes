name: F-Nodes

on:
  workflow_dispatch:
#  schedule:
#    - cron: '0 18,0,6,12 * * *'
concurrency:
  group: mc-startup
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 强制 5 分钟超时，防止挂死浪费额度
    permissions:
      contents: read
      actions: write
    concurrency:
      group: falix-renew
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装基础依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb unzip jq
          pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0
          sbase install chromedriver

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 执行续期任务
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FALIX_SERVER_IP: ${{ secrets.FALIX_SERVER_IP }}
        run: |
          mkdir -p output/screenshots
          python main.py

    #  - name: 清理
    #    if: always()
    #    run: rm -rf output/screenshots/*.png
