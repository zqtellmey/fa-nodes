name: FalixNodes Auto Renew

on:
  workflow_dispatch: # 支持手动点击运行
  schedule:
    # 按照香港时间 (HKT) 每 6 小时运行一次
    # 对应 UTC: 18:00, 00:00, 06:00, 12:00
    - cron: '0 18,0,6,12 * * *'

jobs:
  renew_job:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          # 针对 Ubuntu 24.04 深度优化
          # 1. 使用 libasound2t64 代替 libasound2
          # 2. 移除已不存在的 libgconf-2-4
          # 3. 使用 libgl1, libglx-mesa0 解决渲染问题
          sudo apt-get install -y \
            xvfb \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libxrender1 \
            libxcomposite1 \
            libasound2t64 \
            libxslt1.1 \
            libosmesa6 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxrandr2 \
            libgbm1

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests pyvirtualdisplay
          # 安装浏览器驱动
          sbase install chromedriver

      - name: 执行续期并发送截图到 TG
        env:
          # 请确保在 GitHub Settings -> Secrets -> Actions 中配置了以下变量
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          mkdir -p output/screenshots
          python main.py

      - name: 清理环境
        if: always()
        run: |
          rm -rf output/screenshots/*.png
