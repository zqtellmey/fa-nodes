name: Fa-Nodes

on:
  workflow_dispatch: # 支持手动点击运行
#  schedule:
    # 按照香港时间 (HKT) 每 6 小时运行一次
    # 对应 UTC: 18:00, 00:00, 06:00, 12:00
 #   - cron: '0 18,0,6,12 * * *'

jobs:
  renew_job:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          # 针对 Ubuntu 24.04+ 修复 GLX 依赖问题
          # 使用 libgl1, libglx-mesa0 代替已弃用的 libgl1-mesa-glx
          sudo apt-get install -y \
            xvfb \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libxrender1 \
            libxcomposite1 \
            libasound2 \
            libxslt1.1 \
            libgconf-2-4 \
            libosmesa6

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests pyvirtualdisplay
          # 安装 undetected-chromedriver 所需的浏览器驱动
          sbase install chromedriver

      - name: 执行续期并发送截图到 TG
        env:
          # 请确保在 GitHub Settings -> Secrets -> Actions 中配置了以下两个变量
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 如需使用代理，请取消下方注释
          # PROXY_SOCKS5: ${{ secrets.PROXY_SOCKS5 }}
        run: |
          # 确保 output 目录存在，防止脚本保存截图时报错
          mkdir -p output/screenshots
          python main.py

      - name: 上传执行日志 (仅在失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: output/screenshots/

      - name: 清理环境
        if: always()
        run: |
          # 运行结束清理，保护隐私
          rm -rf output/screenshots/*.png
